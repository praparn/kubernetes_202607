apiVersion: batch/v1
kind: CronJob
metadata:
  name: slacknotify
  labels:
    name: slacknotify
    owner: Praparn_L
    version: "1.0"
    module: CronJob
    environment: development
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: slacknotify
            image: curlimages/curl:8.14.1
            env:
            - name: TITLE
              value: "BOT NOTIFY:Praparn L."
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: slack-webhook
                  key: url
            command:
            - /bin/sh
            - -c
            - |
              curl -sf -X POST -H 'Content-type: application/json' \
                --data "{\"text\":\"${TITLE} Cron notify: Pod ${POD_NAME} run on node ${NODE_NAME} at $(date)\"}" \
                "${SLACK_WEBHOOK_URL}"
          restartPolicy: Never
