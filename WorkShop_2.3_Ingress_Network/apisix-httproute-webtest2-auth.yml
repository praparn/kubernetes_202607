# Same HTTPRoute as apisix-httproute-webtest2.yml, now with key-auth enforced
# via the jarvis-key-auth PluginConfig. Re-apply this file over the existing
# webtest2-httproute to turn authentication on for that route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webtest2-httproute
spec:
  parentRefs:
  - name: apisix
    namespace: default
  hostnames:
  - webtest2.kuberneteslabthailand.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: ExtensionRef
      extensionRef:
        group: apisix.apache.org
        kind: PluginConfig
        name: jarvis-key-auth
    backendRefs:
    - name: webtest2
      kind: Service
      port: 80
