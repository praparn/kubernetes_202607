apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webtest2-httproute
spec:
  parentRefs:
  - name: apisix
    namespace: default
  hostnames:
  - webtest2.kuberneteslabthailand.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: webtest2
      kind: Service
      port: 80
